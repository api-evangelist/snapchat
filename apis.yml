apis:
- aid: snapchat:snapchat-ads-api
  name: Snapchat Ads API
  description: >-
    The Snapchat Ads API (Marketing API) allows developers to programmatically create, manage, and optimize
    advertising campaigns on the Snapchat platform. It provides endpoints for managing organizations,
    ad accounts, campaigns, ad squads, ads, creatives, media, funding sources, audience segments, and
    measurement reporting. The API supports the full advertising lifecycle from campaign setup through
    reporting and optimization.
  humanURL: https://developers.snap.com/api/marketing-api/Ads-API/introduction
  tags:
  - Advertising
  - Campaigns
  - Marketing
  properties:
  - type: Documentation
    url: https://developers.snap.com/api/marketing-api/Ads-API/introduction
  - type: OpenAPI
    url: >-
      https://raw.githubusercontent.com/api-evangelist/snapchat/refs/heads/main/openapi/snapchat-ads-api-openapi.yml
  - url: graphql/snapchat-graphql.md
    type: GraphQL
- aid: snapchat:snapchat-creative-kit
  name: Snapchat Creative Kit
  description: >-
    Creative Kit allows developers to let users share content including Lenses, AR experiences, filters,
    GIFs, videos, links, and captions from a website or app directly to Snapchat's camera or preview screen.
    Supports Dynamic Lenses, Stickers, and Spotlight Posting. Available as a code-only integration (SDK
    deprecated October 2024).
  humanURL: https://developers.snap.com/snap-kit/creative-kit/overview
  tags:
  - AR
  - Content Sharing
  - Integration
  - Social Media
  properties:
  - type: Documentation
    url: https://developers.snap.com/snap-kit/creative-kit/overview
  - type: GitHubRepository
    url: https://github.com/Snapchat/creative-kit
- aid: snapchat:snapchat-camera-kit
  name: Snapchat Camera Kit
  description: >-
    Camera Kit enables developers to integrate Snap's AR camera technology directly into iOS, Android,
    and web applications, giving users access to Snap's lens library and AR experiences without leaving
    the host app.
  humanURL: https://developers.snap.com/camera-kit/home
  tags:
  - AR
  - Augmented Reality
  - Camera
  - SDK
  properties:
  - type: Documentation
    url: https://developers.snap.com/camera-kit/home
- aid: snapchat:snapchat-lens-studio
  name: Lens Studio
  description: >-
    Lens Studio is Snap's desktop application for building augmented reality lenses for Snapchat and Spectacles.
    Provides an API for scripting lens behaviors, integrating dynamic data, and publishing to the Snap
    Lens Network.
  humanURL: https://developers.snap.com/lens-studio/home
  tags:
  - AR
  - Augmented Reality
  - Creative Tools
  - Lens
  properties:
  - type: Documentation
    url: https://developers.snap.com/lens-studio/home
