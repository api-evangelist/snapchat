- aid: snapchat:snapchat-ads-mcp
  name: Snapchat Ads MCP Server
  description: >-
    Snap's first-party hosted Model Context Protocol server for the Snapchat Ads API. A supported agent
    connects over streamable HTTP to https://mcp.snapchat.com/ads and authenticates with OAuth 2.0 (authorization
    code + PKCE S256, public client, scope snapads.read) against Snap's own authorization server at mcp.snapchat.com.
    The current release is read-only — an agent can read authorized Snapchat Ads data but cannot create,
    update or delete. Onboarding is self-serve: an organization Admin or Business Admin approves each
    agent once, then every member authorizes individually, and no member gains a permission their Ads
    Manager role does not already grant.
  humanURL: https://developers.snap.com/marketing-api/Ads-MCP/Introduction
  baseURL: https://mcp.snapchat.com/ads
  tags:
  - Advertising
  - Agents
  - MCP
  - Marketing
  properties:
