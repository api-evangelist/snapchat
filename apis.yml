aid: snapchat
url: https://raw.githubusercontent.com/api-evangelist/snapchat/refs/heads/main/apis.yml
modified: '2026-03-20'
common:
  - type: JSON-LD
    url: json-ld/snapchat-context.jsonld
  - type: JSONSchema
    url: json-schema/snapchat-conversion-event-schema.json
  - type: JSONSchema
    url: json-schema/snapchat-ad-campaign-schema.json
apis:
  - aid: snapchat:ads-api
    name: Snapchat Ads API
    tags:
      - Advertising
      - Marketing
      - Campaigns
      - Social Media
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://adsapi.snapchat.com/v1
    humanURL: https://developers.snap.com/api/marketing-api/Ads-API/introduction
    properties:
      - url: https://developers.snap.com/api/marketing-api/Ads-API/introduction
        type: Documentation
      - url: openapi/snapchat-ads-api-openapi.yml
        type: OpenAPI
    description: >-
      The Snapchat Ads API allows developers to programmatically create,
      manage, and optimize advertising campaigns on the Snapchat platform.
      It provides endpoints for managing ad accounts, campaigns, ad squads,
      ads, and creatives, as well as retrieving performance metrics and
      audience targeting data. The API supports the full advertising
      lifecycle from campaign setup through reporting and optimization.
  - aid: snapchat:conversions-api
    name: Snapchat Conversions API
    tags:
      - Conversions
      - Attribution
      - Marketing
      - Analytics
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://tr.snapchat.com
    humanURL: https://developers.snap.com/api/marketing-api/Conversions-API/Introduction
    properties:
      - url: https://developers.snap.com/api/marketing-api/Conversions-API/Introduction
        type: Documentation
      - url: openapi/snapchat-conversions-api-openapi.yml
        type: OpenAPI
    description: >-
      The Snapchat Conversions API (CAPI) is a structured, privacy-centric
      interface that allows advertisers to pass web, app, and offline
      conversion events directly to Snap via a server-to-server integration.
      It helps optimize ad campaigns, improve targeting, and measure
      conversions while supporting first-party custom audience population
      in real-time. Snap recommends using it alongside Pixel or MMP
      integrations for comprehensive measurement.
  - aid: snapchat:login-kit
    name: Snapchat Login Kit
    tags:
      - Authentication
      - OAuth
      - Identity
      - Social Login
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://developers.snap.com/snap-kit/creative-kit/overview
    properties:
      - url: https://developers.snap.com/snap-kit/creative-kit/overview
        type: Documentation
      - url: openapi/snapchat-login-kit-openapi.yml
        type: OpenAPI
    description: >-
      Snapchat Login Kit enables developers to let users sign up and log
      in to their apps using their Snapchat account credentials. Built on
      the industry standard OAuth2 framework, it removes the friction of
      traditional signup flows and allows users to bring their Bitmoji
      avatar and display name into third-party applications. Login Kit is
      available as an SDK for iOS, Android, and Web platforms.
  - aid: snapchat:creative-kit
    name: Snapchat Creative Kit
    tags:
      - Sharing
      - Content
      - Social Media
      - Stickers
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://developers.snap.com/snap-kit/creative-kit/overview
    properties:
      - url: https://developers.snap.com/snap-kit/creative-kit/overview
        type: Documentation
    description: >-
      Snapchat Creative Kit provides developers with advanced sharing
      capabilities that go beyond native share actions. It allows apps to
      send sticker assets for users to decorate Snaps and link to Dynamic
      Lenses for sharing live data like scores or weather. Creative Kit
      does not require the installation of any additional SDKs and is
      available for iOS, Android, and Web platforms.
  - aid: snapchat:bitmoji-kit
    name: Snapchat Bitmoji Kit
    tags:
      - Avatars
      - Personalization
      - Stickers
      - Social Media
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://developers.snap.com/snap-kit/creative-kit/overview
    properties:
      - url: https://developers.snap.com/snap-kit/creative-kit/overview
        type: Documentation
    description: >-
      Snapchat Bitmoji Kit is a sticker picker SDK that provides deeper
      integration with Bitmoji avatars in third-party applications. It
      allows developers to embed a Bitmoji sticker picker so users can
      personalize their experience with their own avatar. Bitmoji Kit
      supports contextual stickers and can be integrated into messaging,
      social, and entertainment applications on iOS and Android.
  - aid: snapchat:camera-kit
    name: Snapchat Camera Kit
    tags:
      - Augmented Reality
      - Camera
      - Lenses
      - AR
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://developers.snap.com/camera-kit/home
    properties:
      - url: https://developers.snap.com/camera-kit/home
        type: Documentation
    description: >-
      Snapchat Camera Kit is a cross-platform SDK that allows developers
      to bring Snap's AR Lens technology into their own iOS, Android, and
      web applications. It supports Remote APIs for bidirectional
      communication between Lenses and host applications, enabling
      real-time data exchange including images, 3D models, and other
      content. Camera Kit enables developers to enrich their apps with
      engaging AR experiences powered by the same technology behind
      Snapchat's camera.
  - aid: snapchat:lens-studio-api
    name: Snapchat Lens Studio API
    tags:
      - Augmented Reality
      - Lenses
      - AR Development
      - 3D
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://developers.snap.com/lens-studio/home
    properties:
      - url: https://developers.snap.com/lens-studio/home
        type: Documentation
      - url: https://developers.snap.com/api/lens-studio/Full-API-List
        type: Documentation
    description: >-
      The Snapchat Lens Studio API provides a comprehensive scripting
      interface for building augmented reality Lenses on the Snapchat
      platform. It includes APIs for depth sensing, automated speech
      recognition in over 40 languages, 3D object generation via
      Snap3D, and a Plugins Editor API for extending Lens Studio
      functionality. Lens Studio serves as the primary development
      environment for creating AR experiences distributed through
      Snapchat and Camera Kit.
