specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Snapchat
providerId: snapchat
created: '2026-05-04'
# 2026-08-13: upgraded generated -> searched. Re-checked the developer portal and
# developers.snap.com/llms.txt for any API pricing, plan, quota-tier or metered-billing page.
# There is none: Snap publishes no developer plan SKU for the Marketing API, Conversions API,
# Login Kit, Creative Kit, Camera Kit, Lens Studio or the Ads MCP server. Access is gated on a
# Business Manager account, not on a paid tier, and the only money in the loop is auction ad spend
# invoiced through Snap Business Manager. plan_count is 1 because "free developer access" is the
# one real access tier, not because a priced plan was found.
method: searched
plan_count: 1
plan_note: >-
  No paid API plan exists. The single entry below records free, self-serve programmatic access.
  Ad spend is auction-priced and billed outside any developer plan.
modified: '2026-08-13'
reconciled: true
tags:
  - Advertising
  - AR
  - Augmented Reality
  - Marketing
  - Messaging
  - Social Media
description: Snapchat does not publish a paid pricing tier for its Marketing API, Conversions API, Login
  Kit, Creative Kit, Camera Kit, or Lens Studio. Programmatic access is offered free to registered developers
  and Snap Business Manager accounts. Cost is incurred only when running paid ads (auction-based) and
  is invoiced through Snap Business Manager rather than a developer plan SKU.
sources:
  - https://developers.snap.com/marketing-api/Ads-API/rate-limits
  - https://developers.snap.com/marketing-api/home
plans:
  - id: snapchat-developer-access
    name: Developer Access
    type: freemium
    description: Free programmatic access to Snap's developer APIs. Approved Snap Business Manager / developer
      accounts can call the Marketing API, Conversions API, Login Kit, Creative Kit, Camera Kit, and Lens
      Studio without a per-call API fee. Ad spend itself is auction-based and billed separately via Snap
      Business Manager.
    entries:
      - label: API Requests
        name: api_requests
        type: flat
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Ad Spend (auction-based)
        name: ad_spend
        type: metered
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see Snap Business Manager
        userMultiplied: false
    elements:
      - name: Snap Marketing API
      - name: Snap Conversions API
      - name: Snap Login Kit
      - name: Snap Creative Kit
      - name: Snap Camera Kit
      - name: Lens Studio
      - name: Snap Business Manager
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
