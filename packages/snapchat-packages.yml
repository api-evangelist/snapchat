description: >-
  First-party Snap client libraries across npm, Maven Central and PyPI. Currency splits sharply by
  product line: the Camera Kit family is actively released (npm @snap/camera-kit 1.20.0 on
  2026-08-07, Maven com.snap.camerakit 1.50.0 in June 2026), while the Snap Kit family — Login Kit,
  Creative Kit, Core Kit — has not shipped a Maven release since November 2023, consistent with
  Snap's own docs deprecating the Login Kit and Creative Kit SDKs in favour of raw OAuth 2.0 and a
  code-only integration. The Conversions API Business SDKs are Java-current and stale everywhere
  else; the published Java docs still cite version 1.1.5 while Maven Central has shipped 1.2.1.
