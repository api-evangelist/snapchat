principles:
  - name: Visibility
    description: Use Snap Business Manager reporting plus the Marketing API stats endpoints to retrieve
      spend, impressions, clicks, and conversions per campaign and ad account.
  - name: Allocation
    description: Allocate ad spend by ad account, campaign, ad squad, and country dimensions returned
      by the Marketing API; tag campaigns to the internal team or product driving them.
  - name: Optimization
    description: Tune bid strategy, audience targeting, and creative rotation; respect the 20 req/s app
      and 10 req/s per-token Marketing API limits to avoid wasted retries.
  - name: Accountability
    description: Each Snap Business Manager organization assigns roles for finance and campaign owners
      who reconcile invoices against Marketing API reporting.
