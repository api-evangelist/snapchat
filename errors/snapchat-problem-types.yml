- status: 429
  title: Rate limit exceeded
  operations: 2
  remediation: >-
    Two simultaneous caps — 20 req/s per registered application and 10 req/s per access token. Snap
    documents no Retry-After header; back off exponentially with jitter. See rate-limits/.
  source: https://developers.snap.com/marketing-api/Ads-API/rate-limits
