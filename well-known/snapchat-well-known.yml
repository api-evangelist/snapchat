description: >-
  Well-known discovery probe across every Snap-controlled host in this repo. Two real documents
  were served: an RFC 9116 security.txt on snapchat.com pointing at Snap's HackerOne program, and
  the RFC 8414 / RFC 9728 OAuth metadata pair that the Snapchat Ads MCP server publishes for its
  own resource path. Note the metadata pair is served at the RESOURCE-SUFFIXED paths
  (/.well-known/oauth-authorization-server/ads), not the bare host paths, which 404.
