- https://mcp.snapchat.com
documents:
- host: https://snapchat.com
  path: /.well-known/security.txt
  status: 200
  file: snapchat-security.txt
  note: RFC 9116. Contact + Policy both point at https://hackerone.com/snapchat.
- host: https://mcp.snapchat.com
  path: /.well-known/oauth-authorization-server/ads
  status: 200
  file: snapchat-mcp-oauth-authorization-server.json
  note: >-
    RFC 8414 authorization server metadata for the Snapchat Ads MCP server. authorization_code +
    refresh_token grants, PKCE S256 required, token_endpoint_auth_methods_supported = ["none"]
    (public client). No dynamic client registration endpoint is advertised, matching the docs.
