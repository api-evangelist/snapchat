providerId: snapchat
description: >-
  Crosswalk between Snapchat's agent surface (the hosted Ads MCP server) and its REST surface (the
  Marketing API OpenAPIs in this repo). The crosswalk is DELIBERATELY EMPTY. Snap publishes a real
  remote MCP server at https://mcp.snapchat.com/ads, but publishes no tool list anywhere — not in
  the Ads MCP docs, not in developers.snap.com/llms.txt — and tools/list returns 401 without an
  OAuth token issued to an approved organization. With zero observed tool names there is nothing to
  bind, and inventing plausible tool names to fill rows would be fabrication. What IS recorded is
  the shape of the gate and the full REST inventory the tools must be drawn from.

