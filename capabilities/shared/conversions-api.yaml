naftiko: "1.0.0-alpha1"

info:
  label: "Snapchat Conversions API"
  description: >-
    The Snapchat Conversions API (CAPI) is a server-to-server interface
    for passing web, app, and offline conversion events directly to Snap.
    Helps optimize ad campaigns and measure conversions while supporting
    privacy-centric first-party data integration.
  tags:
    - Advertising
    - Analytics
    - Conversions
    - Privacy
    - Snapchat
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SNAPCHAT_CAPI_ACCESS_TOKEN: SNAPCHAT_CAPI_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: snapchat-capi
      baseUri: https://tr.snapchat.com/v3
      description: "Snapchat Conversions API for server-to-server event tracking"
      authentication:
        type: apikey
        key: access_token
        value: "{{SNAPCHAT_CAPI_ACCESS_TOKEN}}"
        placement: query
      resources:
        - name: pixel-events
          path: /{pixel_id}/events
          description: "Send web conversion events via Pixel ID"
          operations:
            - name: send-web-conversion-events
              method: POST
              description: "Send Web Conversion Events"
              inputParameters:
                - name: pixel_id
                  in: path
                  type: string
                  required: true
                  description: "Snap Pixel ID"
              body:
                type: json
                data:
                  data: "{{tools.events}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: app-events
          path: /{snap_app_id}/events
          description: "Send app conversion events via Snap App ID"
          operations:
            - name: send-app-conversion-events
              method: POST
              description: "Send App Conversion Events"
              inputParameters:
                - name: snap_app_id
                  in: path
                  type: string
                  required: true
                  description: "Snap App ID"
              body:
                type: json
                data:
                  data: "{{tools.events}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: snapchat-capi-api
      resources:
        - path: /v1/pixel-events
          name: pixel-events
          description: "Send web conversion events"
          operations:
            - method: POST
              name: send-web-events
              description: "Send Web Conversion Events"
              call: "snapchat-capi.send-web-conversion-events"
              with:
                pixel_id: "rest.pixel_id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: snapchat-capi-mcp
      transport: http
      tools:
        - name: send-web-conversion-events
          description: "Send web conversion events to Snapchat via server-to-server CAPI"
          hints:
            readOnly: false
            destructive: false
          call: "snapchat-capi.send-web-conversion-events"
          with:
            pixel_id: "tools.pixel_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: send-app-conversion-events
          description: "Send app conversion events to Snapchat via server-to-server CAPI"
          hints:
            readOnly: false
            destructive: false
          call: "snapchat-capi.send-app-conversion-events"
          with:
            snap_app_id: "tools.snap_app_id"
          outputParameters:
            - type: object
              mapping: "$."
