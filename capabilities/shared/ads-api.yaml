naftiko: "1.0.0-alpha1"

info:
  label: "Snapchat Ads API"
  description: >-
    The Snapchat Ads API allows developers to programmatically create,
    manage, and optimize advertising campaigns. Covers organizations, ad
    accounts, campaigns, ad squads, ads, creatives, media, audience segments,
    funding sources, and measurement reporting.
  tags:
    - Advertising
    - Campaigns
    - Marketing
    - Snapchat
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SNAPCHAT_ACCESS_TOKEN: SNAPCHAT_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: snapchat-ads
      baseUri: https://adsapi.snapchat.com/v1
      description: "Snapchat Ads API for programmatic campaign management"
      authentication:
        type: bearer
        token: "{{SNAPCHAT_ACCESS_TOKEN}}"
      resources:
        - name: organizations
          path: /me/organizations
          description: "Retrieve organizations the user has access to"
          operations:
            - name: list-organizations
              method: GET
              description: "List All Organizations"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: organization
          path: /organizations/{organization_id}
          description: "Manage a specific organization"
          operations:
            - name: get-organization
              method: GET
              description: "Get a Specific Organization"
              inputParameters:
                - name: organization_id
                  in: path
                  type: string
                  required: true
                  description: "Organization ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: ad-accounts
          path: /organizations/{organization_id}/adaccounts
          description: "Manage ad accounts for an organization"
          operations:
            - name: list-ad-accounts
              method: GET
              description: "List All Ad Accounts for an Organization"
              inputParameters:
                - name: organization_id
                  in: path
                  type: string
                  required: true
                  description: "Organization ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-ad-account
              method: POST
              description: "Create an Ad Account"
              inputParameters:
                - name: organization_id
                  in: path
                  type: string
                  required: true
                  description: "Organization ID"
              body:
                type: json
                data:
                  adaccounts: "{{tools.adaccounts}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: campaigns
          path: /adaccounts/{ad_account_id}/campaigns
          description: "Manage campaigns for an ad account"
          operations:
            - name: list-campaigns
              method: GET
              description: "List All Campaigns for an Ad Account"
              inputParameters:
                - name: ad_account_id
                  in: path
                  type: string
                  required: true
                  description: "Ad Account ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-campaign
              method: POST
              description: "Create a Campaign"
              inputParameters:
                - name: ad_account_id
                  in: path
                  type: string
                  required: true
                  description: "Ad Account ID"
              body:
                type: json
                data:
                  campaigns: "{{tools.campaigns}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: ad-squads
          path: /adaccounts/{ad_account_id}/adsquads
          description: "Manage ad squads for an ad account"
          operations:
            - name: create-ad-squad
              method: POST
              description: "Create an Ad Squad"
              inputParameters:
                - name: ad_account_id
                  in: path
                  type: string
                  required: true
                  description: "Ad Account ID"
              body:
                type: json
                data:
                  adsquads: "{{tools.adsquads}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: ads
          path: /adaccounts/{ad_account_id}/ads
          description: "Manage ads for an ad account"
          operations:
            - name: list-ads
              method: GET
              description: "List All Ads for an Ad Account"
              inputParameters:
                - name: ad_account_id
                  in: path
                  type: string
                  required: true
                  description: "Ad Account ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: audience-segments
          path: /adaccounts/{ad_account_id}/segments
          description: "Manage audience segments for ad targeting"
          operations:
            - name: list-audience-segments
              method: GET
              description: "List All Audience Segments for an Ad Account"
              inputParameters:
                - name: ad_account_id
                  in: path
                  type: string
                  required: true
                  description: "Ad Account ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: stats-campaign
          path: /adaccounts/{ad_account_id}/campaigns/{campaign_id}/stats
          description: "Campaign performance statistics"
          operations:
            - name: get-campaign-stats
              method: GET
              description: "Get Campaign Statistics"
              inputParameters:
                - name: ad_account_id
                  in: path
                  type: string
                  required: true
                  description: "Ad Account ID"
                - name: campaign_id
                  in: path
                  type: string
                  required: true
                  description: "Campaign ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: snapchat-ads-api
      resources:
        - path: /v1/organizations
          name: organizations
          description: "List all accessible organizations"
          operations:
            - method: GET
              name: list-organizations
              description: "List All Organizations"
              call: "snapchat-ads.list-organizations"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/campaigns
          name: campaigns
          description: "Manage ad campaigns"
          operations:
            - method: POST
              name: create-campaign
              description: "Create a Campaign"
              call: "snapchat-ads.create-campaign"
              with:
                ad_account_id: "rest.ad_account_id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: snapchat-ads-mcp
      transport: http
      tools:
        - name: list-organizations
          description: "List all Snapchat organizations accessible to the authenticated user"
          hints:
            readOnly: true
            openWorld: false
          call: "snapchat-ads.list-organizations"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-campaigns
          description: "List all campaigns for a Snapchat ad account"
          hints:
            readOnly: true
            openWorld: false
          call: "snapchat-ads.list-campaigns"
          with:
            ad_account_id: "tools.ad_account_id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-audience-segments
          description: "List all custom audience segments for a Snapchat ad account"
          hints:
            readOnly: true
            openWorld: false
          call: "snapchat-ads.list-audience-segments"
          with:
            ad_account_id: "tools.ad_account_id"
          outputParameters:
            - type: object
              mapping: "$."
