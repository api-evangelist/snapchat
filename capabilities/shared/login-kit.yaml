naftiko: "1.0.0-alpha1"

info:
  label: "Snapchat Login Kit API"
  description: >-
    Snapchat Login Kit provides OAuth 2.0-based user authentication,
    allowing app users to sign in with their Snapchat credentials.
    Provides authorization, token exchange, token refresh, and user
    profile retrieval including display name and Bitmoji avatar.
  tags:
    - Authentication
    - Identity
    - OAuth
    - Snapchat
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SNAPCHAT_CLIENT_ID: SNAPCHAT_CLIENT_ID
      SNAPCHAT_CLIENT_SECRET: SNAPCHAT_CLIENT_SECRET
      SNAPCHAT_ACCESS_TOKEN: SNAPCHAT_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: snapchat-login
      baseUri: https://kit.snapchat.com/v1
      description: "Snapchat Login Kit API for OAuth user authentication"
      authentication:
        type: bearer
        token: "{{SNAPCHAT_ACCESS_TOKEN}}"
      resources:
        - name: user-profile
          path: /me
          description: "Retrieve authenticated user profile"
          operations:
            - name: get-user-profile
              method: GET
              description: "Get Authenticated User Profile"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: snapchat-login-api
      resources:
        - path: /v1/me
          name: user-profile
          description: "Get the authenticated Snapchat user profile"
          operations:
            - method: GET
              name: get-user-profile
              description: "Get Authenticated User Profile"
              call: "snapchat-login.get-user-profile"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: snapchat-login-mcp
      transport: http
      tools:
        - name: get-user-profile
          description: "Retrieve the authenticated Snapchat user's profile including display name and Bitmoji"
          hints:
            readOnly: true
            openWorld: false
          call: "snapchat-login.get-user-profile"
          outputParameters:
            - type: object
              mapping: "$."
