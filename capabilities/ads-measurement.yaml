naftiko: 1.0.0-alpha2
info:
  label: Snapchat Ads API — Measurement
  description: 'Snapchat Ads API — Measurement. 4 operations. Lead operation: Get Ad Account Statistics. Self-contained Naftiko
    capability covering one Snapchat business surface.'
  tags:
  - Snapchat
  - Measurement
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SNAPCHAT_API_KEY: SNAPCHAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: ads-measurement
    baseUri: https://adsapi.snapchat.com/v1
    description: Snapchat Ads API — Measurement business capability. Self-contained, no shared references.
    resources:
    - name: adaccounts-ad_account_id-stats
      path: /adaccounts/{ad_account_id}/stats
      operations:
      - name: getadaccountstats
        method: GET
        description: Get Ad Account Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ads-ad_id-stats
      path: /ads/{ad_id}/stats
      operations:
      - name: getadstats
        method: GET
        description: Get Ad Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: adsquads-ad_squad_id-stats
      path: /adsquads/{ad_squad_id}/stats
      operations:
      - name: getadsquadstats
        method: GET
        description: Get Ad Squad Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: campaigns-campaign_id-stats
      path: /campaigns/{campaign_id}/stats
      operations:
      - name: getcampaignstats
        method: GET
        description: Get Campaign Statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SNAPCHAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: ads-measurement-rest
    port: 8080
    description: REST adapter for Snapchat Ads API — Measurement. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/adaccounts/{ad-account-id}/stats
      name: adaccounts-ad-account-id-stats
      description: REST surface for adaccounts-ad_account_id-stats.
      operations:
      - method: GET
        name: getadaccountstats
        description: Get Ad Account Statistics
        call: ads-measurement.getadaccountstats
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ads/{ad-id}/stats
      name: ads-ad-id-stats
      description: REST surface for ads-ad_id-stats.
      operations:
      - method: GET
        name: getadstats
        description: Get Ad Statistics
        call: ads-measurement.getadstats
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/adsquads/{ad-squad-id}/stats
      name: adsquads-ad-squad-id-stats
      description: REST surface for adsquads-ad_squad_id-stats.
      operations:
      - method: GET
        name: getadsquadstats
        description: Get Ad Squad Statistics
        call: ads-measurement.getadsquadstats
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/campaigns/{campaign-id}/stats
      name: campaigns-campaign-id-stats
      description: REST surface for campaigns-campaign_id-stats.
      operations:
      - method: GET
        name: getcampaignstats
        description: Get Campaign Statistics
        call: ads-measurement.getcampaignstats
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ads-measurement-mcp
    port: 9090
    transport: http
    description: MCP adapter for Snapchat Ads API — Measurement. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-ad-account-statistics
      description: Get Ad Account Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ads-measurement.getadaccountstats
      outputParameters:
      - type: object
        mapping: $.
    - name: get-ad-statistics
      description: Get Ad Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ads-measurement.getadstats
      outputParameters:
      - type: object
        mapping: $.
    - name: get-ad-squad-statistics
      description: Get Ad Squad Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ads-measurement.getadsquadstats
      outputParameters:
      - type: object
        mapping: $.
    - name: get-campaign-statistics
      description: Get Campaign Statistics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ads-measurement.getcampaignstats
      outputParameters:
      - type: object
        mapping: $.
