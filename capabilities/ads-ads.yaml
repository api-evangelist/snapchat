naftiko: 1.0.0-alpha2
info:
  label: Snapchat Ads API — Ads
  description: 'Snapchat Ads API — Ads. 7 operations. Lead operation: List All Ads for an Ad Account. Self-contained Naftiko
    capability covering one Snapchat business surface.'
  tags:
  - Snapchat
  - Ads
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SNAPCHAT_API_KEY: SNAPCHAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: ads-ads
    baseUri: https://adsapi.snapchat.com/v1
    description: Snapchat Ads API — Ads business capability. Self-contained, no shared references.
    resources:
    - name: adaccounts-ad_account_id-ads
      path: /adaccounts/{ad_account_id}/ads
      operations:
      - name: listadsbyadaccount
        method: GET
        description: List All Ads for an Ad Account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ads-ad_id
      path: /ads/{ad_id}
      operations:
      - name: getad
        method: GET
        description: Get a Specific Ad
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatead
        method: PUT
        description: Update an Ad
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletead
        method: DELETE
        description: Delete an Ad
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: adsquads-ad_squad_id-ads
      path: /adsquads/{ad_squad_id}/ads
      operations:
      - name: listadsbyadsquad
        method: GET
        description: List All Ads for an Ad Squad
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createad
        method: POST
        description: Create an Ad
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: campaigns-campaign_id-ads
      path: /campaigns/{campaign_id}/ads
      operations:
      - name: listadsbycampaign
        method: GET
        description: List All Ads for a Campaign
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SNAPCHAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: ads-ads-rest
    port: 8080
    description: REST adapter for Snapchat Ads API — Ads. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/adaccounts/{ad-account-id}/ads
      name: adaccounts-ad-account-id-ads
      description: REST surface for adaccounts-ad_account_id-ads.
      operations:
      - method: GET
        name: listadsbyadaccount
        description: List All Ads for an Ad Account
        call: ads-ads.listadsbyadaccount
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/ads/{ad-id}
      name: ads-ad-id
      description: REST surface for ads-ad_id.
      operations:
      - method: GET
        name: getad
        description: Get a Specific Ad
        call: ads-ads.getad
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatead
        description: Update an Ad
        call: ads-ads.updatead
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletead
        description: Delete an Ad
        call: ads-ads.deletead
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/adsquads/{ad-squad-id}/ads
      name: adsquads-ad-squad-id-ads
      description: REST surface for adsquads-ad_squad_id-ads.
      operations:
      - method: GET
        name: listadsbyadsquad
        description: List All Ads for an Ad Squad
        call: ads-ads.listadsbyadsquad
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createad
        description: Create an Ad
        call: ads-ads.createad
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/campaigns/{campaign-id}/ads
      name: campaigns-campaign-id-ads
      description: REST surface for campaigns-campaign_id-ads.
      operations:
      - method: GET
        name: listadsbycampaign
        description: List All Ads for a Campaign
        call: ads-ads.listadsbycampaign
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ads-ads-mcp
    port: 9090
    transport: http
    description: MCP adapter for Snapchat Ads API — Ads. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-all-ads-ad-account
      description: List All Ads for an Ad Account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ads-ads.listadsbyadaccount
      outputParameters:
      - type: object
        mapping: $.
    - name: get-specific-ad
      description: Get a Specific Ad
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ads-ads.getad
      outputParameters:
      - type: object
        mapping: $.
    - name: update-ad
      description: Update an Ad
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: ads-ads.updatead
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-ad
      description: Delete an Ad
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: ads-ads.deletead
      outputParameters:
      - type: object
        mapping: $.
    - name: list-all-ads-ad-squad
      description: List All Ads for an Ad Squad
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ads-ads.listadsbyadsquad
      outputParameters:
      - type: object
        mapping: $.
    - name: create-ad
      description: Create an Ad
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ads-ads.createad
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-all-ads-campaign
      description: List All Ads for a Campaign
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ads-ads.listadsbycampaign
      outputParameters:
      - type: object
        mapping: $.
