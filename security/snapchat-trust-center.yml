description: >-
  Snap Inc. publishes a trust / assurance profile at trust.snap.com covering application security,
  infrastructure, data protection, access control, incident response and business resiliency. What
  it does NOT publish is a certification: the profile's own certificationSelections list is empty,
  and every attached document — including the Information Security Policy, the Security Incident
  Response Policy, the Resiliency and Crisis Management Policy, the Pentest Report summary, and the
  CAIQ and SIG Lite questionnaires — is marked isPublic false, i.e. released only on request.
  Recording this as an assurance surface, NOT as published compliance.
certifications: []
certifications_note: >-
  No SOC 2, SOC 1, ISO 27001, ISO 27701, PCI DSS, HIPAA, FedRAMP or CSA STAR attestation is named
  anywhere on the profile, and the platform's certificationSelections array is literally empty.
  Absence of a named certification here is a measurement, not an inference.
