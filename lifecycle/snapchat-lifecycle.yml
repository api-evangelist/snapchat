provider: Snapchat
providerId: snapchat
description: >-
  Snap's lifecycle posture is uneven by product line. Versioning is a path segment and stable
  (Marketing API v1, Conversions API v3). Deprecation is announced — a dedicated Lens API
  Deprecation guide with replacement APIs and a blocking timeline, a Marketing API Newsletter that
  exists specifically to carry launches and deprecations, and a Camera Kit LTS commitment of one
  year of fixes per LTS release. What Snap does NOT publish is an SLA, a machine-readable
  deprecation signal (no RFC 8594 Sunset or Deprecation response headers are documented anywhere in
  the Marketing API reference), or an API status page — no status host resolves.
versioning:
  scheme: path
  current:
  - api: Snapchat Marketing API
    version: v1
    base: https://adsapi.snapchat.com/v1
    docs: https://developers.snap.com/marketing-api/Ads-API/version
  - api: Snapchat Conversions API
    version: v3
    base: https://tr.snapchat.com/v3
    docs: https://developers.snap.com/marketing-api/Conversions-API/Introduction
    migration_guide: https://developers.snap.com/marketing-api/Conversions-API/MigrationGuide
    note: v2 -> v3 migration guide is published; v2 is the superseded generation.
  policy_url: https://developers.snap.com/marketing-api/Ads-API/version
  note: Snap's version page is a single line — "The API is versioned. The current version is v1."
deprecation:
  has_policy: true
  channels:
  - name: Lens API Deprecation guide
    url: https://developers.snap.com/api/lens-api-deprecation
    description: >-
      Enumerates deprecated Lens Studio APIs, their modern replacements, and the timeline for when
      each deprecated API will be BLOCKED — the strongest deprecation artifact Snap publishes.
  - name: Marketing API Newsletter
    url: https://developers.snap.com/marketing-api/Ads-API/newsletter
    description: Subscription channel for Marketing API and Conversions API launches and deprecations.
  - name: Announcements
    url: https://developers.snap.com/marketing-api/Ads-API/announcements
    description: Dated announcements including validation and placement changes.
  sunset_header: false
  deprecation_header: false
  headers_note: >-
    No RFC 8594 Sunset header and no Deprecation header is documented in the Marketing API
    reference. A client cannot detect an impending removal at runtime; it has to read the newsletter.
  observed_deprecations:
  - item: Login Kit SDKs
    status: deprecated
    replacement: Direct OAuth 2.0 integration against accounts.snapchat.com
    source: https://developers.snap.com/snap-kit/login-kit/overview
    note: >-
      "While these SDKs are being deprecated, the underlying OAuth2 service remains fully
      available." Maven com.snap.loginkit:loginkit has not released since 2023-11-30.
  - item: Creative Kit SDK
    status: deprecated
    date: '2024-10'
    replacement: Code-only Creative Kit integration
    source: https://developers.snap.com/snap-kit/creative-kit/overview
  - item: Conversions API v2
    status: superseded
    replacement: Conversions API v3
    source: https://developers.snap.com/marketing-api/Conversions-API/MigrationGuide
  - item: Lens Studio deprecated APIs
    status: deprecated
    replacement: Documented per-API in the Lens API Deprecation guide
    source: https://developers.snap.com/api/lens-api-deprecation
