source: openapi/*.yml, json-schema/, https://developers.snap.com/marketing-api/Ads-API/api-patterns
provider: Snapchat
providerId: snapchat
description: >-
  Entity-relationship graph for the Snapchat Marketing API, derived from the id-reference fields and
  URL nesting in the 13 refined OpenAPI files. The hierarchy is strictly five deep — Organization
  owns Ad Accounts, an Ad Account owns Campaigns, a Campaign owns Ad Squads, an Ad Squad owns Ads,
  and an Ad points at exactly one Creative — with Media, Audience Segments and Funding Sources
  hanging off the sides. Snap's own URL pattern
  (/{PLURAL_PARENT_ENTITY}/{PARENT_ID}/{PLURAL_ENTITY}) makes the containment relationships
  legible directly from the path. Conversions API events are a separate, unrelated write surface
  keyed on a pixel or app asset id.
id_format:
  type: uuid
  prefixed: false
  note: >-
    All entity ids are bare UUID v4 with no type prefix — an id string alone does not identify what
    kind of entity it is. This matters for agents: unlike Stripe's cus_/ch_ prefixes, a Snap id
    carries no self-describing type, so the operation that returned it is the only type evidence.
root: Organization
entities:
- name: Organization
  description: A brand, partner or ad agency. Created in Snap Business Manager, not via the API.
  read_only_via_api: true
  operations:
  - listOrganizations
  - getOrganization
  relationships:
  - type: has_many
    target: AdAccount
    via: organization_id
  - type: has_many
    target: FundingSource
    via: organization_id
- name: AdAccount
  description: Container for campaigns, owned by one Organization, backed by one or more Funding Sources.
  operations:
  - listAdAccounts
  - createAdAccount
  - updateAdAccount
  - getAdAccount
  relationships:
  - type: belongs_to
