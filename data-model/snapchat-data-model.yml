  - type: has_many
    target: Creative
    via: ad_account_id
  - type: has_many
    target: Media
    via: ad_account_id
  - type: has_many
    target: AudienceSegment
    via: ad_account_id
- name: FundingSource
  description: Payment method for an Organization — credit card, PayPal, or line of credit.
  operations:
  - listFundingSources
  relationships:
  - type: belongs_to
    target: Organization
    via: organization_id
- name: Campaign
  description: Business objective plus a budget; groups Ad Squads and aggregates their statistics.
  operations:
  - listCampaigns
  - createCampaign
  - getCampaign
  - updateCampaign
  - deleteCampaign
  relationships:
  - type: belongs_to
    target: AdAccount
    via: ad_account_id
  - type: has_many
    target: AdSquad
    via: campaign_id
  - type: has_many
    target: Ad
    via: campaign_id
    note: Convenience traversal — GET /campaigns/{id}/ads flattens across the campaign's ad squads.
  - type: has_one
    target: Stats
    via: campaign_id
- name: AdSquad
  description: Targeting, budget, schedule, placement and bid strategy for a set of Ads.
  operations:
  - listAdSquadsByCampaign
  - listAdSquadsByAdAccount
  - createAdSquad
  - getAdSquad
  - updateAdSquad
  - deleteAdSquad
  relationships:
  - type: belongs_to
    target: Campaign
    via: campaign_id
  - type: has_many
    target: Ad
    via: ad_squad_id
  - type: has_many
    target: AudienceSegment
    via: targeting
    note: Referenced through the ad squad's targeting block rather than a single foreign key.
  - type: has_one
    target: Stats
    via: ad_squad_id
- name: Ad
  description: The deliverable unit — one Creative placed inside one Ad Squad.
  operations:
  - listAdsByAdSquad
  - listAdsByCampaign
  - listAdsByAdAccount
  - createAd
  - getAd
  - updateAd
  - deleteAd
