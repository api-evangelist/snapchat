  - createCreative
  - getCreative
  relationships:
  - type: belongs_to
    target: AdAccount
    via: ad_account_id
  - type: has_one
    target: Media
    via: media_id
  note: >-
    No delete operation is exposed for Creatives, unlike Campaigns, Ad Squads and Ads. Creatives
    accumulate.
- name: Media
  description: Uploaded image or video asset. Two-step — create the record, then upload the bytes.
  operations:
  - listMedia
  - createMedia
  - uploadMedia
  relationships:
  - type: belongs_to
    target: AdAccount
    via: ad_account_id
  upload:
    path: POST /media/{media_id}/upload
    media_type: multipart/form-data
    note: >-
      createMedia returns a media_id; the bytes go to a second call. An agent must sequence these
      two, and there is no idempotency key protecting the pair.
